<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#14101F" />
<meta name="description" content="Simulate a Magic: The Gathering prerelease — pick a set, crack six packs, build a 40-card deck." />
<title>Prerelease — Sealed Pool Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cards.scryfall.io" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;800&family=Karla:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#14101F; --felt:#1E1830; --raised:#282039; --stamp:#E8B34A;
  --holo:#7BE0D6; --parch:#EDE6DC; --mute:#8B819D; --line:#3A3151; --bad:#E0685A;
  --disp:'Big Shoulders Display',sans-serif;
  --body:'Karla',sans-serif;
  --mono:'Space Mono',monospace;
  --tile:200px;
}
@media (max-width:600px){:root{--tile:150px}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parch);font-family:var(--body);min-height:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--holo);outline-offset:2px}

header{border-bottom:1px solid var(--line);padding:18px 20px 14px;display:flex;align-items:baseline;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--disp);font-size:48px;font-weight:800;margin:0;line-height:.9;text-transform:uppercase}
.tag{font-family:var(--mono);font-size:12px;color:var(--mute);margin:6px 0 0;letter-spacing:.08em}
.setmeta{font-family:var(--mono);font-size:13px;color:var(--mute);text-align:right;letter-spacing:.08em}
.setmeta b{color:var(--stamp);font-weight:400;display:block}
main{padding:20px;max-width:1400px;margin:0 auto}

.eyebrow{font-family:var(--mono);font-size:12px;color:var(--stamp);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:14px}
.note{font-family:var(--mono);font-size:13px;color:var(--mute);margin:0 0 16px;line-height:1.7;letter-spacing:.06em}
.note.bad{color:var(--bad)}

input[type=text],input[type=number]{font-family:var(--body);background:var(--felt);border:1px solid var(--line);
  border-radius:6px;color:var(--parch);padding:12px 14px;font-size:15px}
#search{flex:1;min-width:220px;max-width:460px}

.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.setbtn{font-family:var(--body);text-align:left;background:var(--felt);border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;color:var(--parch);cursor:pointer;display:flex;align-items:center;gap:12px}
.setbtn:hover{border-color:var(--stamp)}
.setbtn img{width:22px;height:22px;filter:invert(1) sepia(1) saturate(.4);opacity:.85;flex-shrink:0}
.setbtn .nm{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setbtn .cd{font-family:var(--mono);font-size:12px;color:var(--mute)}

.btn-primary{font-family:var(--disp);font-size:24px;font-weight:800;text-transform:uppercase;
  background:var(--stamp);color:var(--ink);border:none;border-radius:5px;padding:10px 26px;cursor:pointer}
.btn-ghost{font-family:var(--mono);font-size:13px;background:transparent;color:var(--mute);
  border:1px solid var(--line);border-radius:5px;padding:9px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.btn-ghost:hover{color:var(--parch);border-color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.pack{width:74px;height:104px;border-radius:5px;border:1px solid var(--stamp);
  background:linear-gradient(160deg,var(--raised),var(--felt));color:var(--stamp);cursor:pointer;
  font-family:var(--mono);font-size:10px;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:8px;position:relative;overflow:hidden}
.pack::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 30%,rgba(123,224,214,.28) 45%,rgba(232,179,74,.24) 52%,
    rgba(200,140,224,.22) 60%,transparent 75%);
  background-size:260% 260%;background-position:0% 0%;transition:background-position .9s ease,opacity .3s}
.pack:hover::after{opacity:1;background-position:100% 100%}
.pack[disabled]{border-style:dashed;border-color:var(--line);background:transparent;color:var(--mute);cursor:default}
.pack[disabled]::after{display:none}

.table{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:820px){.table{grid-template-columns:1fr}}
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:12px}

.tile{position:relative;animation:flipin .42s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes flipin{from{transform:rotateY(-75deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.tile .card{display:block;width:100%;padding:0;border-radius:6px;cursor:pointer;background:var(--raised);
  overflow:hidden;border:2px solid transparent;position:relative}
.tile .card img{display:block;width:100%;border-radius:4px}
.tile.sel .card{border-color:var(--holo);box-shadow:0 0 0 1px var(--holo),0 6px 18px rgba(0,0,0,.5)}
.tile .meta{font-family:var(--mono);font-size:11px;color:var(--mute);display:flex;justify-content:space-between;
  padding:3px 2px 0;align-items:center;letter-spacing:.06em}
.tile .zoom{font-family:var(--mono);font-size:11px;background:none;border:none;color:var(--mute);cursor:pointer;padding:0}
.tile .badge{font-family:var(--mono);position:absolute;top:5px;left:5px;font-size:10px;background:var(--stamp);
  color:var(--ink);padding:2px 5px;border-radius:3px;text-transform:uppercase}
.foil::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(120deg,transparent 35%,rgba(123,224,214,.45) 48%,rgba(232,179,74,.4) 55%,transparent 68%);
  background-size:300% 300%;animation:sheen 3.2s linear infinite;mix-blend-mode:screen}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}

aside{background:var(--felt);border:1px solid var(--line);border-radius:8px;padding:16px;
  position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:820px){aside{position:static;max-height:none}}
.decktop{display:flex;align-items:baseline;justify-content:space-between}
.decktop span:first-child{font-family:var(--disp);font-size:32px;font-weight:800;text-transform:uppercase}
.count{font-family:var(--mono);font-size:19px;color:var(--stamp)}
.count.ok{color:var(--holo)}
.bar{height:3px;background:var(--line);border-radius:2px;margin:10px 0 14px;overflow:hidden}
.bar div{height:100%;background:var(--stamp);transition:width .25s}
.bar div.ok{background:var(--holo)}
.deckrow{width:100%;text-align:left;background:none;border:none;color:var(--parch);padding:7px 0;
  font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--raised);
  font-family:var(--body)}
.deckrow:hover{color:var(--bad)}
.deckrow .mark{font-family:var(--mono);font-size:11px;width:12px}
.deckrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.basicrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.step{font-family:var(--mono);width:26px;height:26px;border-radius:4px;background:none;
  border:1px solid var(--line);color:var(--parch);cursor:pointer;font-size:12px;line-height:1}
.stepval{font-family:var(--mono);font-size:14px;width:22px;text-align:center}
.btn-copy{font-family:var(--mono);font-size:13px;background:transparent;color:var(--holo);
  border:1px solid var(--holo);border-radius:5px;padding:9px 16px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.08em}
.btn-copy:hover{background:var(--holo);color:var(--ink)}
#fallback{width:100%;height:150px;font-family:var(--mono);font-size:13px;background:var(--ink);
  color:var(--parch);border:1px solid var(--line);border-radius:5px;padding:8px;resize:vertical}
.sortbtn{font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:4px;cursor:pointer;
  background:transparent;color:var(--mute);border:1px solid var(--line)}
.sortbtn.on{background:var(--stamp);color:var(--ink);border-color:var(--stamp)}

#lightbox{position:fixed;inset:0;background:rgba(10,7,16,.9);display:none;align-items:center;
  justify-content:center;z-index:50;padding:24px;text-align:center}
#lightbox.show{display:flex}
#lightbox img{max-height:78vh;max-width:90vw;border-radius:12px}
#lightbox p{font-family:var(--mono);font-size:13px;color:var(--mute);margin-top:12px;letter-spacing:.08em}

footer{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:48px;padding-top:16px;
  border-top:1px solid var(--line);line-height:1.8;letter-spacing:.06em}

@media (prefers-reduced-motion:reduce){
  .tile{animation:none}.foil::after{animation:none}.pack::after{transition:none}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Prerelease</h1>
    <p class="tag">SEALED POOL SIMULATOR · SIX PACKS · BUILD FORTY</p>
  </div>
  <div class="setmeta" id="setmeta"></div>
</header>

<main id="app"></main>

<div id="lightbox"><div><img id="lbimg" alt="" /><p id="lbcap"></p></div></div>

<script>
/* ============================================================
   Card data: Scryfall (https://scryfall.com)
   Unofficial Fan Content. Not affiliated with Wizards of the Coast.
   ============================================================ */

const API = "https://api.scryfall.com";
const HEADERS = { Accept: "application/json" };
// Browsers forbid setting User-Agent. Scryfall asks apps to send one —
// if you ever move fetching server-side, set: User-Agent: PrereleaseSim/1.0

const sleep = ms => new Promise(r => setTimeout(r, ms));
const roll  = () => Math.random();
const pick  = a => a[Math.floor(Math.random() * a.length)];
const pad   = n => String(n).padStart(2, "0");
const esc   = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- cache: survives reloads, degrades silently if storage is blocked ---------- */
const cache = {
  get(k){ try{ const v = localStorage.getItem("pr:"+k); if(!v) return null;
    const o = JSON.parse(v); if(Date.now()-o.t > 864e5) return null; return o.d; }catch(e){ return null; } },
  set(k,d){ try{ localStorage.setItem("pr:"+k, JSON.stringify({t:Date.now(),d})); }catch(e){ /* quota */ } }
};

async function fetchAllPages(url, onProgress){
  const out = []; let next = url;
  while(next){
    const res = await fetch(next, { headers: HEADERS });
    if(res.status === 404) break;
    if(!res.ok) throw new Error("Scryfall returned " + res.status);
    const data = await res.json();
    out.push(...(data.data || []));
    if(onProgress) onProgress(out.length);
    next = data.has_more ? data.next_page : null;
    if(next) await sleep(120);           // stay under Scryfall's rate limit
  }
  return out;
}

/* ---------- collation ---------- */
const MYTHIC_ERA = "2008-10-03";  // Shards of Alara — mythics introduced
const PLAY_ERA   = "2024-02-09";  // Murders at Karlov Manor — Play Boosters

const eraFor = d => !d ? "draft" : d >= PLAY_ERA ? "play" : d >= MYTHIC_ERA ? "draft" : "classic";
const ERA_LABEL = { play:"Play Booster", draft:"Draft Booster", classic:"Draft Booster (pre-mythic)" };

// draw without replacement within one pack
function drawer(pool){
  const used = new Set();
  return () => {
    if(!pool.length) return null;
    for(let i=0;i<40;i++){ const c = pick(pool); if(!used.has(c.id)){ used.add(c.id); return c; } }
    return pick(pool);
  };
}

/* Wildcard rarity split. NOT an official table — tuned so aggregate rare counts
   land near the published ~58/37/4% one/two/three-rare rates. Adjust freely. */
function wildcardRarity(){
  const r = roll();
  if(r < 0.03) return "mythic";
  if(r < 0.24) return "rare";
  if(r < 0.54) return "uncommon";
  return "common";
}

function buildPack(p, era, packIndex){
  const cards = [];
  const drawC = drawer(p.common), drawU = drawer(p.uncommon);
  const byRarity = { common:p.common, uncommon:p.uncommon, rare:p.rare, mythic:p.mythic };

  const add = (card, slot, opts) => {
    opts = opts || {};
    if(!card) return;
    cards.push(Object.assign({}, card, { uid: packIndex+"-"+cards.length+"-"+card.id, slot:slot,
      foil: !!opts.foil, special: opts.special || null }));
  };
  const rareOrMythic = mc =>
    (p.mythic.length && roll() < mc) ? pick(p.mythic) : pick(p.rare.length ? p.rare : p.mythic);
  const wild = () => { const w = wildcardRarity();
    return pick(byRarity[w].length ? byRarity[w] : p.common); };

  if(era === "play"){
    for(let i=1;i<=6;i++) add(drawC(), i);
    if(p.list.length && roll() < 0.125) add(pick(p.list), 7, {special:"The List"});
    else add(drawC(), 7);
    for(let i=8;i<=10;i++) add(drawU(), i);
    add(rareOrMythic(0.14), 11);
    add(p.land.length ? pick(p.land) : drawC(), 12, {foil: roll() < 0.2});
    add(wild(), 13);
    add(wild(), 14, {foil:true});
  } else if(era === "draft"){
    for(let i=1;i<=10;i++) add(drawC(), i);
    for(let i=11;i<=13;i++) add(drawU(), i);
    add(rareOrMythic(0.125), 14);
    if(roll() < 0.33) add(wild(), 15, {foil:true});
    else if(p.land.length) add(pick(p.land), 15);
  } else {
    for(let i=1;i<=11;i++) add(drawC(), i);
    for(let i=12;i<=14;i++) add(drawU(), i);
    add(pick(p.rare.length ? p.rare : p.uncommon), 15);
  }
  return cards;
}

function buildPromo(p){
  const c = (p.mythic.length && roll() < 0.14) ? pick(p.mythic) : pick(p.rare.length ? p.rare : p.mythic);
  if(!c) return null;
  return Object.assign({}, c, { uid:"promo-"+c.id, slot:0, foil:true, special:"Prerelease promo" });
}

/* ---------- card helpers ---------- */
const imgOf = (c,s) => { s = s || "normal";
  return (c.image_uris && c.image_uris[s]) ||
    (c.card_faces && c.card_faces[0].image_uris && c.card_faces[0].image_uris[s]) || null; };
const isLand  = c => (c.type_line||"").indexOf("Land") !== -1;
const isBasic = c => (c.type_line||"").indexOf("Basic Land") === 0;

const MARK = { common:"C", uncommon:"U", rare:"R", mythic:"M", special:"S", bonus:"B" };
const RCOL = { common:"#B9B2C6", uncommon:"#A9C3D6", rare:"#E8B34A", mythic:"#E27B4A",
               special:"#C99BE0", bonus:"#C99BE0" };
const BASICS = [
  ["Plains","#F3E9C9"],["Island","#A9CCE8"],["Swamp","#A79FB0"],
  ["Mountain","#E5A18A"],["Forest","#A5C9A1"]
];
const CORDER = ["W","U","B","R","G","C","M"];
function bucket(c){
  const ci = c.color_identity || [];
  if(isLand(c)) return "L";
  if(!ci.length) return "C";
  return ci.length > 1 ? "M" : ci[0];
}

/* ---------- state ---------- */
const S = {
  sets:[], setsError:null, query:"", chosen:null,
  loading:false, loadCount:0, loadError:null,
  pools:null, packs:[], opened:[], promo:null,
  includePromo:true, packCount:6,
  deck:new Set(), basics:{Plains:0,Island:0,Swamp:0,Mountain:0,Forest:0},
  sort:"color", exportCodes:false, copyMsg:"", tile:200, approx:false
};

const app = document.getElementById("app");
const setmeta = document.getElementById("setmeta");

/* ---------- data loading ---------- */
function clearCache(){
  try{
    Object.keys(localStorage).filter(k => k.indexOf("pr:") === 0)
      .forEach(k => localStorage.removeItem(k));
  }catch(e){ /* storage blocked — nothing cached anyway */ }
}

async function loadSets(force){
  const cached = force ? null : cache.get("sets");
  if(cached){ S.sets = cached; render(); return; }
  try{
    const res = await fetch(API + "/sets", { headers: HEADERS });
    if(!res.ok) throw new Error("Scryfall returned " + res.status);
    const data = await res.json();
    S.sets = (data.data||[])
      .filter(s => !s.digital && s.card_count >= 60 &&
        ["core","expansion","masters","draft_innovation","starter","funny"].indexOf(s.set_type) !== -1)
      .map(s => ({ code:s.code, name:s.name, released_at:s.released_at, icon_svg_uri:s.icon_svg_uri }))
      .sort((a,b) => (b.released_at||"").localeCompare(a.released_at||""));
    cache.set("sets", S.sets);
  }catch(e){ S.setsError = e.message; }
  render();
}

async function loadSet(code){
  const s = S.sets.filter(x => x.code === code)[0];
  S.chosen = s; S.loadError = null; S.packs = []; S.opened = []; S.promo = null;
  S.deck = new Set(); S.basics = {Plains:0,Island:0,Swamp:0,Mountain:0,Forest:0};

  const cached = cache.get("set:"+code);
  if(cached){ S.pools = cached; S.approx = false; render(); return; }

  S.loading = true; S.loadCount = 0; render();
  try{
    const url = API + "/cards/search?q=" + encodeURIComponent("set:"+code) + "&unique=prints&order=set";
    const all = await fetchAllPages(url, n => { S.loadCount = n; render(); });
    const notFluff = c => c.lang === "en" &&
      ["token","art_series","double_faced_token"].indexOf(c.layout) === -1;

    // Normal path: trust Scryfall's booster flag.
    let ok = all.filter(c => c.booster && notFluff(c));
    S.approx = false;

    // Spoiler-season fallback: a set can be fully on Scryfall days before the
    // booster flag is populated (happens every prerelease week). Rather than
    // fail, fall back to every non-token card and say so in the UI.
    if(!ok.length || !ok.filter(c => c.rarity === "common").length){
      ok = all.filter(notFluff);
      S.approx = true;
    }

    // keep only what we render — full card objects blow past the storage quota
    const slim = c => ({
      id:c.id, name:c.name, rarity:c.rarity, cmc:c.cmc, set:c.set,
      collector_number:c.collector_number, type_line:c.type_line, color_identity:c.color_identity,
      image_uris: c.image_uris ? {normal:c.image_uris.normal, large:c.image_uris.large} : null,
      card_faces: c.card_faces ? c.card_faces.map(f => ({
        image_uris: f.image_uris ? {normal:f.image_uris.normal, large:f.image_uris.large} : null })) : null
    });

    const p = {
      common:   ok.filter(c => c.rarity==="common" && !isBasic(c)).map(slim),
      uncommon: ok.filter(c => c.rarity==="uncommon").map(slim),
      rare:     ok.filter(c => c.rarity==="rare").map(slim),
      mythic:   ok.filter(c => c.rarity==="mythic").map(slim),
      land:     ok.filter(c => isLand(c) && (c.rarity==="common" || isBasic(c))).map(slim),
      list:     []
    };
    if(!p.common.length || !p.uncommon.length || !(p.rare.length || p.mythic.length))
      throw new Error(s.name + " has an incomplete pool on Scryfall (C " + p.common.length +
        " / U " + p.uncommon.length + " / R " + p.rare.length + " / M " + p.mythic.length +
        "). Very new sets sometimes land before their rarities and booster flags do — " +
        "try Refresh data, or come back after release day.");

    if(eraFor(s.released_at) === "play"){
      try{
        const lst = await fetchAllPages(API + "/cards/search?q=" + encodeURIComponent("set:plst") + "&unique=prints");
        p.list = lst.filter(c => c.lang === "en").map(slim);
      }catch(e){ /* non-fatal — packs work without The List */ }
    }
    S.pools = p;
    cache.set("set:"+code, p);
  }catch(e){ S.loadError = e.message; S.pools = null; }
  S.loading = false; render();
}

/* ---------- actions ---------- */
function openKit(){
  if(!S.pools) return;
  const era = eraFor(S.chosen.released_at);
  S.packs = [];
  for(let i=0;i<S.packCount;i++) S.packs.push(buildPack(S.pools, era, i));
  S.opened = []; S.deck = new Set();
  S.promo = S.includePromo ? buildPromo(S.pools) : null;
  render();
}
function poolCards(){
  const flat = [];
  S.packs.forEach((pk,i) => { if(S.opened.indexOf(i) !== -1) flat.push.apply(flat, pk); });
  return (S.promo && S.opened.length) ? [S.promo].concat(flat) : flat;
}
function sortedPool(){
  const a = poolCards().slice();
  if(S.sort === "color"){
    a.sort((x,y) => {
      const ix = bucket(x)==="L" ? 99 : CORDER.indexOf(bucket(x));
      const iy = bucket(y)==="L" ? 99 : CORDER.indexOf(bucket(y));
      return ix - iy || (x.cmc||0) - (y.cmc||0);
    });
  } else if(S.sort === "rarity"){
    const o = {mythic:0,rare:1,special:1,bonus:1,uncommon:2,common:3};
    a.sort((x,y) => ((o[x.rarity]===undefined?4:o[x.rarity]) - (o[y.rarity]===undefined?4:o[y.rarity]))
      || (x.cmc||0) - (y.cmc||0));
  } else {
    a.sort((x,y) => (x.cmc||0)-(y.cmc||0) || x.name.localeCompare(y.name));
  }
  return a;
}
const basicTotal = () => Object.keys(S.basics).reduce((a,k) => a + S.basics[k], 0);
const deckTotal  = () => S.deck.size + basicTotal();

/* ---------- export ----------
   Plain "1 Card Name" lines — imports cleanly into Moxfield, Archidekt,
   Arena, Deckstats, and most proxy tools. Works at any card count;
   there's no 40-card requirement here on purpose. */
function listText(cards, withBasics){
  const rows = [], seen = {};
  cards.forEach(c => {
    const key = S.exportCodes ? c.name+"|"+c.set+"|"+c.collector_number : c.name;
    if(seen[key]) { seen[key].n++; return; }
    seen[key] = { n:1, name:c.name, set:c.set, cn:c.collector_number };
    rows.push(key);
  });
  const lines = rows.map(k => {
    const r = seen[k];
    return r.n + " " + r.name +
      (S.exportCodes && r.set ? " (" + r.set.toUpperCase() + ") " + r.cn : "");
  });
  if(withBasics) BASICS.forEach(b => { if(S.basics[b[0]] > 0) lines.push(S.basics[b[0]] + " " + b[0]); });
  return lines.join("\n");
}

const decklistText = () => listText(poolCards().filter(c => S.deck.has(c.uid)), true);
const poolText     = () => listText(poolCards(), false);

async function copyList(kind){
  const text = kind === "pool" ? poolText() : decklistText();
  const n    = kind === "pool" ? poolCards().length : deckTotal();
  const what = kind === "pool" ? "POOL" : "DECK";
  if(!text){ S.copyMsg = "NOTHING TO COPY YET"; render(); return; }
  try{
    // Clipboard API needs a secure context — fine on GitHub Pages (https),
    // usually blocked on file://. Fall back to the old execCommand path.
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    S.copyMsg = "COPIED " + what + " — " + n + " CARDS";
    S.showText = false;
  }catch(e){
    S.copyMsg = "COPY BLOCKED — SELECT THE TEXT BELOW";
    S.fallbackKind = kind;
    S.showText = true;
  }
  render();
  setTimeout(() => { if(S.copyMsg.indexOf("COPIED") === 0){ S.copyMsg = ""; render(); } }, 2500);
}

/* ---------- render ---------- */
function render(){
  setmeta.innerHTML = S.chosen
    ? "<b>"+esc(S.chosen.name.toUpperCase())+"</b>"+esc(S.chosen.code.toUpperCase())+" · "+
      esc(S.chosen.released_at||"")+" · "+esc(ERA_LABEL[eraFor(S.chosen.released_at)])
    : "";

  const phase = !S.chosen ? "pick" : (S.packs.length ? "table" : "kit");
  if(phase === "pick") renderPick();
  else if(phase === "kit") renderKit();
  else renderTable();

  app.insertAdjacentHTML("beforeend",
    '<footer>CARD DATA &amp; IMAGES FROM SCRYFALL. NOT AFFILIATED WITH WIZARDS OF THE COAST.<br>'+
    'PACK CONTENTS ARE APPROXIMATED FROM PUBLISHED SLOT STRUCTURES — NOT OFFICIAL COLLATION.</footer>');
}

function renderPick(){
  const q = S.query.trim().toLowerCase();
  const list = !q ? S.sets.slice(0,40)
    : S.sets.filter(s => s.name.toLowerCase().indexOf(q) !== -1 || s.code.indexOf(q) !== -1).slice(0,40);

  app.innerHTML =
    '<div class="eyebrow">01 — Choose a set</div>' +
    (S.setsError ? '<p class="note bad">Couldn\'t reach Scryfall: '+esc(S.setsError)+'</p>' : '') +
    '<div class="row" style="margin-bottom:18px">' +
      '<input type="text" id="search" placeholder="Search sets by name or code…" value="'+esc(S.query)+'">' +
      '<button class="btn-ghost" id="refresh" title="Set data is cached 24h — refresh if a brand-new set is missing">Refresh data</button></div>' +
    (!S.sets.length && !S.setsError ? '<p class="note">Loading sets…</p>' : '') +
    '<div class="setgrid">' + list.map(s =>
      '<button class="setbtn" data-code="'+esc(s.code)+'">' +
        (s.icon_svg_uri ? '<img src="'+esc(s.icon_svg_uri)+'" alt="">' : '') +
        '<span style="min-width:0"><span class="nm">'+esc(s.name)+'</span>' +
        '<span class="cd">'+esc(s.code.toUpperCase())+' · '+esc(s.released_at||"")+' · '+
        esc(ERA_LABEL[eraFor(s.released_at)].split(" ")[0])+'</span></span></button>'
    ).join("") + '</div>';

  const inp = document.getElementById("search");
  inp.addEventListener("input", e => {
    const pos = e.target.selectionStart;
    S.query = e.target.value;
    render();
    const n = document.getElementById("search");
    n.focus(); n.setSelectionRange(pos,pos);
  });
  document.getElementById("refresh").addEventListener("click", () => {
    clearCache();
    S.sets = []; S.setsError = null; render();
    loadSets(true);
  });
  Array.prototype.forEach.call(app.querySelectorAll(".setbtn"), b =>
    b.addEventListener("click", () => loadSet(b.dataset.code)));
}

function renderKit(){
  const p = S.pools, era = eraFor(S.chosen.released_at);
  app.innerHTML =
    '<div class="eyebrow">02 — Your kit</div>' +
    (S.loading ? '<p class="note">Pulling '+esc(S.chosen.name)+' from Scryfall… '+S.loadCount+' cards</p>' : '') +
    (S.loadError ? '<p class="note bad">'+esc(S.loadError)+'</p>' : '') +
    (p && !S.loading ?
      '<p class="note">COMMONS '+p.common.length+' · UNCOMMONS '+p.uncommon.length+
        ' · RARES '+p.rare.length+' · MYTHICS '+p.mythic.length+
        '<br>COLLATION: '+esc(ERA_LABEL[era].toUpperCase())+'</p>' +
      (S.approx ? '<p class="note" style="color:var(--stamp)">⚠ THIS SET HAS NO BOOSTER FLAGS ON SCRYFALL YET — ' +
        'POOL INCLUDES EVERY CARD IN THE SET, SO COLLECTOR-ONLY AND PROMO PRINTINGS MAY APPEAR. ' +
        'RE-PULL AFTER RELEASE DAY FOR ACCURATE PACKS.</p>' : '') +
      '<div class="row" style="margin-bottom:24px;gap:22px">' +
        '<label class="note" style="margin:0;display:flex;align-items:center;gap:8px">PACKS ' +
          '<input type="number" id="pc" min="1" max="12" value="'+S.packCount+'" style="width:64px;padding:6px 8px;font-family:var(--mono)"></label>' +
        '<label class="note" style="margin:0;display:flex;align-items:center;gap:8px;cursor:pointer">' +
          '<input type="checkbox" id="promo" '+(S.includePromo?"checked":"")+'> STAMPED FOIL PROMO</label>' +
      '</div>' +
      '<div class="row"><button class="btn-primary" id="crack">Crack the kit</button>' +
        '<button class="btn-ghost" id="back">Different set</button></div>'
    : (S.loadError ? '<button class="btn-ghost" id="back">Back to sets</button>' : ''));

  const pc = document.getElementById("pc");
  if(pc) pc.addEventListener("change", e => { S.packCount = Math.min(12, Math.max(1, +e.target.value || 1)); });
  const pr = document.getElementById("promo");
  if(pr) pr.addEventListener("change", e => { S.includePromo = e.target.checked; });
  const cr = document.getElementById("crack");
  if(cr) cr.addEventListener("click", openKit);
  const bk = document.getElementById("back");
  if(bk) bk.addEventListener("click", () => { S.chosen=null; S.pools=null; S.loadError=null; render(); });
}

function tileHTML(c, i){
  const src = imgOf(c,"normal");
  const sel = S.deck.has(c.uid);
  return '<div class="tile'+(sel?" sel":"")+'" style="animation-delay:'+(Math.min(i,20)*22)+'ms">' +
    '<button class="card'+(c.foil?" foil":"")+'" data-uid="'+esc(c.uid)+'" title="'+esc(c.name)+'">' +
      (src ? '<img src="'+esc(src)+'" alt="'+esc(c.name)+'" loading="lazy">'
           : '<span style="display:block;padding:12px;font-size:12px;min-height:150px">'+esc(c.name)+'</span>') +
    '</button>' +
    (c.special ? '<span class="badge">'+esc(c.special)+'</span>' : '') +
    '<div class="meta"><span style="color:'+(RCOL[c.rarity]||"#8B819D")+'">' +
      (c.slot ? "S"+pad(c.slot) : "PROMO")+' · '+(MARK[c.rarity]||"•")+'</span>' +
      '<span style="display:flex;gap:5px;align-items:center">' +
      (c.foil ? '<span style="color:var(--holo)">FOIL</span>' : '') +
      '<button class="zoom" data-zoom="'+esc(c.uid)+'">ZOOM</button></span></div></div>';
}

function renderTable(){
  const pool = sortedPool(), total = deckTotal(), ok = total >= 40;
  const deckList = poolCards().filter(c => S.deck.has(c.uid));

  app.innerHTML =
    '<div class="row" style="margin-bottom:8px"><span class="eyebrow" style="margin:0">03 — Open</span>' +
      '<span class="note" style="margin:0">'+S.opened.length+'/'+S.packs.length+' OPENED</span></div>' +
    '<div class="row" style="gap:8px;margin-bottom:22px">' +
      S.packs.map((_,i) => '<button class="pack" data-pack="'+i+'"'+(S.opened.indexOf(i)!==-1?" disabled":"")+'>' +
        pad(i+1)+'/'+pad(S.packs.length)+'</button>').join("") +
      (S.opened.length < S.packs.length ? '<button class="btn-ghost" id="openall">Open all</button>' : '') +
    '</div>' +
    (!S.opened.length ? '' :
    '<div class="table"><div style="min-width:0">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
        '<span class="note" style="margin:0">POOL '+pool.length+' · TAP TO ADD</span>' +
        '<span style="display:flex;gap:6px">' +
        ["color","rarity","cmc"].map(m => '<button class="sortbtn'+(S.sort===m?" on":"")+'" data-sort="'+m+'">'+
          m.toUpperCase()+'</button>').join("") +
        '<span style="width:10px"></span>' +
        [["M",160],["L",200],["XL",260]].map(t => '<button class="sortbtn'+(S.tile===t[1]?" on":"")+'" data-tile="'+t[1]+'">'+
          t[0]+'</button>').join("") + '</span></div>' +
      '<div class="poolgrid">' + pool.map(tileHTML).join("") + '</div></div>' +

    '<aside><div class="decktop"><span>Deck</span>' +
      '<span class="count'+(ok?" ok":"")+'">'+total+'/40</span></div>' +
      '<div class="bar"><div class="'+(ok?"ok":"")+'" style="width:'+Math.min(100,total/40*100)+'%"></div></div>' +
      '<p class="note" style="margin:0 0 14px">'+(ok?"LEGAL — 40 CARD MINIMUM MET":(40-total)+" MORE TO GO")+'</p>' +
      (!deckList.length ? '<p style="font-size:13px;color:var(--mute);line-height:1.5">Nothing picked yet. '+
        'Tap cards in your pool to build a 40-card deck, then top it off with basics.</p>' : '') +
      deckList.map(c => '<button class="deckrow" data-uid="'+esc(c.uid)+'">' +
        '<span class="mark" style="color:'+(RCOL[c.rarity]||"#8B819D")+'">'+(MARK[c.rarity]||"•")+'</span>' +
        '<span class="nm">'+esc(c.name)+'</span>' +
        '<span style="font-family:var(--mono);font-size:11px;color:var(--mute)">×</span></button>').join("") +
      '<div class="note" style="margin:18px 0 8px">BASIC LANDS</div>' +
      BASICS.map(b => '<div class="basicrow"><span class="dot" style="background:'+b[1]+'"></span>' +
        '<span style="flex:1">'+b[0]+'</span>' +
        '<button class="step" data-basic="'+b[0]+'" data-d="-1">−</button>' +
        '<span class="stepval">'+S.basics[b[0]]+'</span>' +
        '<button class="step" data-basic="'+b[0]+'" data-d="1">+</button></div>').join("") +
      '<div style="margin-top:18px;display:flex;flex-direction:column;gap:8px">' +
        '<button class="btn-copy" id="copy">Copy decklist</button>' +
        '<button class="btn-copy alt" id="copypool">Copy full pool ('+pool.length+')</button>' +
        '<label class="note" style="margin:0;display:flex;align-items:center;gap:7px;cursor:pointer">' +
          '<input type="checkbox" id="codes" '+(S.exportCodes?"checked":"")+'> INCLUDE SET CODE + NUMBER</label>' +
        (S.copyMsg ? '<p class="note" style="margin:0;color:'+
          (S.copyMsg.indexOf("COPIED")===0?"var(--holo)":"var(--stamp)")+'">'+esc(S.copyMsg)+'</p>' : '') +
        (S.showText ? '<textarea id="fallback" readonly>'+
          esc(S.fallbackKind === "pool" ? poolText() : decklistText())+'</textarea>' : '') +
        '<button class="btn-ghost" id="clear">Clear deck</button>' +
        '<button class="btn-ghost" id="repool">New pool, same set</button>' +
        '<button class="btn-ghost" id="newset">Different set</button></div>' +
    '</aside></div>');

  const each = (sel, fn) => Array.prototype.forEach.call(app.querySelectorAll(sel), fn);

  each("[data-pack]", b => b.addEventListener("click", () => {
    const i = +b.dataset.pack; if(S.opened.indexOf(i) === -1) S.opened.push(i); render();
  }));
  const oa = document.getElementById("openall");
  if(oa) oa.addEventListener("click", () => { S.opened = S.packs.map((_,i)=>i); render(); });

  each("[data-sort]", b => b.addEventListener("click", () => { S.sort = b.dataset.sort; render(); }));
  each("[data-tile]", b => b.addEventListener("click", () => {
    S.tile = +b.dataset.tile;
    document.documentElement.style.setProperty("--tile", S.tile + "px");
    render();
  }));

  each(".card[data-uid]", b => b.addEventListener("click", () => {
    const u = b.dataset.uid;
    if(S.deck.has(u)) S.deck.delete(u); else S.deck.add(u);
    render();
  }));
  each(".deckrow[data-uid]", b => b.addEventListener("click", () => {
    S.deck.delete(b.dataset.uid); render();
  }));
  each("[data-zoom]", b => b.addEventListener("click", e => {
    e.stopPropagation();
    const c = poolCards().filter(x => x.uid === b.dataset.zoom)[0];
    if(c) showLightbox(c);
  }));
  each("[data-basic]", b => b.addEventListener("click", () => {
    const n = b.dataset.basic;
    S.basics[n] = Math.max(0, S.basics[n] + (+b.dataset.d));
    render();
  }));

  document.getElementById("copy").addEventListener("click", () => copyList("deck"));
  document.getElementById("copypool").addEventListener("click", () => copyList("pool"));
  document.getElementById("codes").addEventListener("change", e => {
    S.exportCodes = e.target.checked; S.copyMsg = ""; render();
  });
  const fb = document.getElementById("fallback");
  if(fb){ fb.focus(); fb.select(); }

  document.getElementById("clear").addEventListener("click", () => {
    S.deck = new Set(); S.basics = {Plains:0,Island:0,Swamp:0,Mountain:0,Forest:0}; render();
  });
  document.getElementById("repool").addEventListener("click", openKit);
  document.getElementById("newset").addEventListener("click", () => {
    S.chosen = null; S.pools = null; S.packs = []; render();
  });
}

/* ---------- lightbox ---------- */
const lb = document.getElementById("lightbox");
function showLightbox(c){
  document.getElementById("lbimg").src = imgOf(c,"large") || imgOf(c,"normal") || "";
  document.getElementById("lbcap").textContent =
    c.name.toUpperCase()+" · "+(c.set||"").toUpperCase()+" "+(c.collector_number||"")+
    " · "+(MARK[c.rarity]||"•")+(c.foil?" · FOIL":"");
  lb.classList.add("show");
}
lb.addEventListener("click", () => lb.classList.remove("show"));
document.addEventListener("keydown", e => { if(e.key === "Escape") lb.classList.remove("show"); });

/* ---------- go ---------- */
render();
loadSets();
</script>
</body>
</html>
